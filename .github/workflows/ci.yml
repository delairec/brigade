name: CI

on:
  pull_request:
    paths-ignore:
      - "corpus/**"
      - "docs/**"
      - "artifact/**"
      - "*.md"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests and zipapp on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 --version
      - run: python3 -m pip install -r requirements-ci.txt
      - run: python3 -m pytest -n auto -p no:cacheprovider tests
      - run: python3 build.py
      - run: python3 dist/brigade.pyz --version

  floor:
    name: Refusal under the Python floor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.3"
      - run: python3 build.py
      - name: The clone entry point refuses Python 3.11.3
        run: |
          if bin/brigade --version 2> refusal.txt; then exit 1; fi
          cat refusal.txt
          grep -F "Python 3.11.4 or later" refusal.txt
          grep -F "$(python3 -c 'import platform; print(platform.python_version())')" refusal.txt
      - name: The zipapp refuses Python 3.11.3
        run: |
          if python3 dist/brigade.pyz --version 2> refusal.txt; then exit 1; fi
          cat refusal.txt
          grep -F "Python 3.11.4 or later" refusal.txt
          grep -F "$(python3 -c 'import platform; print(platform.python_version())')" refusal.txt

  zizmor:
    name: Workflow audit by zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python3 -m pip install -r requirements-ci.txt
      - run: zizmor .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}

  ruff:
    name: Lint and format by ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python3 -m pip install -r requirements-ci.txt
      - run: ruff check .
      - run: ruff format --check .

  semgrep:
    name: Security scan by semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # semgrep 1.181.0 declares Python up to 3.14; on 3.15, where RLIM_INFINITY is unsigned, it gives
          # semgrep-core a stack limit of a third of 2**64 and the core segfaults: lifted by a semgrep that declares 3.15
          python-version: "3.14"
      - run: python3 -m pip install -r requirements-ci.txt
      - run: semgrep scan --config p/python --config p/security-audit --error --metrics=off

  vulture:
    name: Dead code by vulture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python3 -m pip install -r requirements-ci.txt
      - run: vulture brigade/ tests/ vulture_whitelist.txt

  coverage:
    name: Coverage of the unit tests by coverage.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r requirements-ci.txt
      - run: coverage run -m unittest discover -s tests/unit -t .
      - run: coverage report
