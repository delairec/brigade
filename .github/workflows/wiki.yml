name: Wiki

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish wiki/ to the GitHub wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
      - name: Replace the pages of the wiki with wiki/, links in the wiki form
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" published
          git -C published rm -rq --ignore-unmatch .
          cp source/wiki/*.md published/
          sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' published/*.md
          git -C published add -A
          if git -C published diff --cached --quiet; then exit 0; fi
          git -C published -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Publish wiki/ of ${GITHUB_SHA}"
          git -C published push --quiet origin HEAD:master
